# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - circuit-rishi

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-circuit-rishi
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install, build, and zip slim standalone
        run: |
          set -euo pipefail
          npm ci
          npm run build
          grep -q "Gaming-desk shop" .next/server/app/index.html
          rm -rf release site.zip
          # Slim Next standalone only — do NOT copy full .next (cache makes a 500MB+ zip).
          cp -a .next/standalone release
          cp -a .next/static release/.next/static
          cp -a public release/public
          cp start.js release/start.js
          cp .deployment release/.deployment
          # Drop traced junk that Turbopack sometimes copies into standalone.
          rm -rf release/.next/cache release/src release/scripts release/deploy release/data
          test -f release/server.js
          test -f release/start.js
          test -f release/.next/BUILD_ID
          test -f release/.next/routes-manifest.json
          test -d release/.next/static
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release/package.json','utf8')); p.scripts=p.scripts||{}; p.scripts.start='node start.js'; fs.writeFileSync('release/package.json', JSON.stringify(p,null,2));"
          (cd release && zip -ryq ../site.zip .)
          echo "zip_bytes=$(wc -c < site.zip)"
          unzip -l site.zip | grep -E '\.next/BUILD_ID|\.next/routes-manifest|\.next/static/|server\.js|start\.js'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: site.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify zip
        run: |
          set -euo pipefail
          unzip -q site.zip -d check
          test -f check/.next/BUILD_ID
          test -f check/.next/routes-manifest.json
          test -f check/server.js
          test -f check/start.js
          test -d check/.next/static

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: circuit-rishi
          slot-name: Production
          package: site.zip
          clean: false
          restart: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_933EB48F75FF44D780C0C1EE2DB36F6B }}
