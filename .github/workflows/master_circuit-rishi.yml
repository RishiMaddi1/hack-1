# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - circuit-rishi

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-circuit-rishi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install and build standalone bundle
        run: |
          set -euo pipefail
          npm ci
          npm run build
          grep -q "Gaming-desk shop" .next/server/app/index.html
          # Copy the whole standalone folder as deploy/ (do NOT mkdir deploy first).
          rm -rf deploy
          cp -a .next/standalone deploy
          cp -a .next/static deploy/.next/static
          cp -a public deploy/public
          cp start.js deploy/start.js
          cp startup.sh deploy/startup.sh
          chmod +x deploy/startup.sh
          test -f deploy/server.js
          test -f deploy/start.js
          test -f deploy/.next/server/app/index.html
          grep -q "Gaming-desk shop" deploy/.next/server/app/index.html
          # Azure Oryx runs `npm start` — force bind via start.js.
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('deploy/package.json','utf8')); p.scripts=p.scripts||{}; p.scripts.start='node start.js'; fs.writeFileSync('deploy/package.json', JSON.stringify(p,null,2));"
          grep -n '"start"' deploy/package.json
          ls -la deploy | head -40

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: circuit-rishi
          slot-name: Production
          package: .
          clean: true
          restart: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_933EB48F75FF44D780C0C1EE2DB36F6B }}
